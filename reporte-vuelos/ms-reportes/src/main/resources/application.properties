spring.application.name=ms-reportes
server.port=8083

# Base de datos PostgreSQL (se pueden pisar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reportes_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Servicios a los que ms-reportes les consulta datos
servicios.aerolineas.url=${AEROLINEAS_URL:http://localhost:8081}
servicios.vuelos.url=${VUELOS_URL:http://localhost:8082}
