spring.application.name=ms-vuelos
server.port=8082

# Base de datos PostgreSQL (se pueden pisar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vuelos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Servicio al que ms-vuelos le consulta los aviones
servicios.aerolineas.url=${AEROLINEAS_URL:http://localhost:8081}
